<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>推广中心 · Relay Hub</title>
  <meta name="description" content="Relay Hub 精选推荐的中转站、AI API 网关,所有跳转均带推广标识。" />
  <link rel="stylesheet" href="../assets/style.css" />
  <style>
    .promote-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 32px 0;
    }
    .promote-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    .promote-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: var(--shadow-hover);
    }
    .promote-card-flag {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--tag-bg);
      color: var(--primary);
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .promote-card-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .promote-card-icon {
      font-size: 32px;
      width: 48px;
      height: 48px;
      background: var(--tag-bg);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .promote-card-name {
      font-size: 18px;
      font-weight: 700;
    }
    .promote-card-tagline {
      color: var(--text-sub);
      font-size: 14px;
      flex: 1;
    }
    .promote-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }
    .promote-card-actions {
      display: flex;
      gap: 8px;
    }
    .promote-card-actions a {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-promote-detail {
      background: var(--bg-hover);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-promote-detail:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-promote-go {
      background: var(--primary);
      color: white;
    }
    .btn-promote-go:hover {
      background: var(--primary-hover);
    }
    .promote-disclaimer {
      text-align: center;
      padding: 32px 0;
      color: var(--text-faint);
      font-size: 13px;
    }
    .promote-disclaimer code {
      background: var(--bg-hover);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="../index.html">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Relay Hub</span>
      </a>
      <nav class="nav">
        <a href="../index.html">← 返回导航</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
          <span class="theme-icon">🌙</span>
        </button>
      </nav>
    </div>
  </header>

  <section class="hero" style="padding: 60px 0 24px;">
    <div class="container">
      <h1 class="hero-title">🎯 推广中心</h1>
      <p class="hero-sub">Relay Hub 精选推荐 · 站长亲测 · 真实评测</p>
    </div>
  </section>

  <section class="cards">
    <div class="container">
      <div id="promote-grid" class="promote-grid"></div>
    </div>
  </section>

  <section class="promote-disclaimer">
    <div class="container">
      <p>本页所有跳转链接均带站长推广标识,注册/充值时本站可能获得返佣。</p>
      <p>仅推荐站长实际使用/评测过的服务,不代表全部用户评价。</p>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>Relay Hub · 推广中心</p>
      <p class="footer-meta">
        <a href="../index.html">返回导航首页</a>
      </p>
    </div>
  </footer>

  <script>
    async function loadPromotes() {
      try {
        const res = await fetch('../promotes.json');
        const data = await res.json();
        const grid = document.getElementById('promote-grid');
        if (!data.promotes || data.promotes.length === 0) {
          grid.innerHTML = '<p style="color:var(--text-faint);text-align:center;grid-column:1/-1;padding:48px 0;">暂无推广内容</p>';
          return;
        }
        grid.innerHTML = data.promotes.map(p => {
          const stars = '⭐'.repeat(Math.floor(p.rating)) + (p.rating % 1 >= 0.5 ? '½' : '');
          return `
            <div class="promote-card">
              <div class="promote-card-flag">🎯 推广</div>
              <div class="promote-card-head">
                <div class="promote-card-icon">${p.icon || '🎯'}</div>
                <div>
                  <div class="promote-card-name">${p.name}</div>
                  <div style="font-size:13px;color:var(--text-faint);">${stars} ${p.rating}</div>
                </div>
              </div>
              <div class="promote-card-tagline">${p.tagline}</div>
              <div class="promote-card-footer">
                <span style="color:var(--text-faint);font-size:12px;">收录 ${p.added}</span>
                <div class="promote-card-actions">
                  <a class="btn-promote-detail" href="${p.landing}">查看详情</a>
                  <a class="btn-promote-go" href="${p.url}" target="_blank" rel="noopener noreferrer">立即访问 →</a>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('promote-grid').innerHTML =
          '<p style="color:#c33;text-align:center;grid-column:1/-1;">推广数据加载失败</p>';
      }
    }
    loadPromotes();
  </script>
  <script src="../assets/app.js"></script>
</body>
</html>
